
trigger:
  - main

pr:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '22.x'
  SOURCE_DIRECTORY: 'force-app'

steps:

# 1. Checkout Salesforce source code
- checkout: self
  displayName: 'Checkout Salesforce Repository'

# 2. Install Node.js
- task: NodeTool@0
  displayName: 'Install Node.js 22 LTS'
  inputs:
    versionSpec: '$(NODE_VERSION)'

# 3. Verify environment
- script: |
    echo "===== Environment Details ====="
    node --version
    npm --version
    java -version
  displayName: 'Verify Build Environment'

# 4. Install Salesforce CLI
- script: |
    set -e
    echo "===== Installing Salesforce CLI ====="
    npm install --global @salesforce/cli@latest
    sf --version
  displayName: 'Install Salesforce CLI'

# 5. Install Salesforce Code Analyzer v5
- script: |
    set -e
    echo "===== Installing Salesforce Code Analyzer ====="
    sf plugins install @salesforce/plugin-code-analyzer
    sf plugins --core
  displayName: 'Install Salesforce Code Analyzer'

# 6. Validate Salesforce Code Analyzer
- script: |
    set -e
    echo "===== Validating Code Analyzer ====="
    sf code-analyzer --help
    sf code-analyzer rules --workspace "$(SOURCE_DIRECTORY)"
  displayName: 'Validate Salesforce Code Analyzer'

# 7. Run Salesforce Security Scan
- script: |
    set -e

    echo "=========================================="
    echo "      SALESFORCE SECURITY SCAN"
    echo "=========================================="

    sf code-analyzer run \
      --workspace "$(SOURCE_DIRECTORY)" \
      --severity-threshold 2

    echo "=========================================="
    echo "      SECURITY SCAN COMPLETED"
    echo "=========================================="

  displayName: 'Run Salesforce Security Scan'
  continueOnError: false


