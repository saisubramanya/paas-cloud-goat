trigger:
  - main
  - develop

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node.js'

  - script: |
      npm install -g @salesforce/cli
    displayName: 'Install Salesforce CLI'

  - script: |
      sf plugins install @salesforce/sfdx-scanner
    displayName: 'Install Salesforce Code Analyzer'

  - script: |
      sf scanner run --target "force-app" --format "junit" --outfile "scanner-results.xml" --severity-threshold 3
    displayName: 'Run Code Analyzer Scan'
    continueOnError: true

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'scanner-results.xml'
      title: 'Salesforce Code Analyzer Results'
    displayName: 'Publish Scan Results'

